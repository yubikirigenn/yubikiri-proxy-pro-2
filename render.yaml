services:
  - type: web
    name: yubikiri-proxy-pro-2
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # PCエージェントとの共有シークレット（8文字以上のランダム値）。
      # 未設定でもサーバーは直接取得のみで動作する。
      - key: AGENT_SECRET
        sync: false
      # ホスト名モード(既定オフ)。有効化する場合のみ HOSTNAME_MODE=1 を設定する。
      # 未設定なら /hostname リレーは搭載されず、既存のパスモードのみが動く。
      # - key: HOSTNAME_MODE
      #   value: "1"
